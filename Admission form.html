<!DOCTYPE html>
<html>
<head>
    <img src="logo.jpg" alt="School Logo" width="100" height="100">
    <title>Admission form</title>
<p>Aisha Bawany Academy,main Shahra e faisal,karachi.</p>

</head>
<body>
    <h1>Admission form</h1>
    <a href="first.html">home</a>
    <a href="about.html">about</a>
    <h2>Aisha bawany Academy</h2>
    <Admission form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">

        <label for="fathername">Father's Name:</label>
        <input type="text" id="fathername" name="fathername">

      <br><br>  <label for="occupation">Occupation:</label>
        <input type="text" id="occupation" name="occupation">

        <label for="qualification">Qualification":</label>
        <input type="text" id="qualification" name="qualification">

         <br><br> <label for="income">Annual Income:</label>
        <input type="text" id="income" name="income">
       
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

    <br><br>  <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="gender">Gender:</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>

         <br><br>   <label for="class">Class for Admission:</label>
    <select id="class" name="class">
    <option value="">Select Class</option>
    <option>Nursery</option>
    <option>LKG</option>
    <option>UKG</option>
    <option>Class 1</option>
    <option>Class 2</option>
    <option>Class 3</option>
    <option>Class 4</option>
    <option>Class 5</option>
    <option>Class 6</option>
    <option>Class 7</option>
    <option>Class 8</option>
    <option>Class 9</option>
    <option>Class 10</option>
    <option>Class 11</option>

    <label for="admission_fee">Admission Fee:</label>
<input type="text" id="admission_fee" name="admission_fee" placeholder="Enter admission fee">

<br><br><label for="monthly_fee">Monthly Fee</label>
<input type="text" id="monthly_fee" name="monthly_fee" placeholder="Enter monthly fee">
    
  <label for="permanent_address">Permanent Address</label>
<textarea id="permanent_address" name="permanent_address" rows="2" placeholder="Enter your permanent address"></textarea>
<br><br> <input type="submit" name="" id="">
    </form>
</body>
